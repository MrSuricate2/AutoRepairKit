name: Build and publish experimental build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      Solution_Name: SamplePlugin

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Compute build version
      id: version
      run: |
        $version = "1.0.0.$env:GITHUB_RUN_NUMBER"
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Build with dotnet
      run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Assemble pluginmaster.json
      id: manifest
      run: |
        $outDir = ".\SamplePlugin\bin\x64\Release\SamplePlugin"
        $manifest = Get-Content "$outDir\SamplePlugin.json" -Raw | ConvertFrom-Json
        $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/experimental/latest.zip"
        $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $downloadUrl -Force
        $manifest | Add-Member -NotePropertyName DownloadLinkTesting -NotePropertyValue $downloadUrl -Force
        $manifest | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue $downloadUrl -Force
        # NB: piping a single-element array into ConvertTo-Json unrolls it back into one object
        # (PowerShell pipeline enumeration), so we must bind -InputObject directly instead of piping.
        $manifestArray = @($manifest)
        $json = ConvertTo-Json -InputObject $manifestArray -Depth 10
        Set-Content -Path "$outDir\pluginmaster.json" -Value $json -Encoding utf8

        # Also drop a copy at the repo root: GitHub Release asset URLs redirect through a
        # signed/expiring Azure blob link, which some HTTP clients choke on. raw.githubusercontent.com
        # is a stable, non-redirecting URL, which is what we actually want people to add as their
        # Dalamud custom repo.
        Copy-Item "$outDir\pluginmaster.json" ".\pluginmaster.json" -Force

    - name: Commit pluginmaster.json to repo root
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pluginmaster.json
        if (git diff --cached --quiet) {
          Write-Host "pluginmaster.json unchanged, skipping commit"
        } else {
          git commit -m "Mise a jour de pluginmaster.json [skip ci]"
          git push
        }

    - name: Publish experimental release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete experimental --yes --cleanup-tag 2>$null
        gh release create experimental `
          ".\SamplePlugin\bin\x64\Release\SamplePlugin\latest.zip" `
          ".\SamplePlugin\bin\x64\Release\SamplePlugin\pluginmaster.json" `
          --title "Build expérimental (v${{ steps.version.outputs.version }})" `
          --notes "Build automatique depuis le commit ${{ github.sha }}." `
          --prerelease

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SamplePlugin
        path: .\SamplePlugin\bin\x64\Release\SamplePlugin\*
        if-no-files-found: error
        retention-days: 7
